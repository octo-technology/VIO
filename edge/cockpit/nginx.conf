server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://edge_orchestrator:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Reference-image batches are posted through here; the 1m nginx default
        # is too small for a set of full-resolution frames.
        client_max_body_size 50m;
    }

}
