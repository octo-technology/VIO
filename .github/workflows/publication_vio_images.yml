name: Publication vio images to Github registry
run-name: Publication vio images to Github registry on branch >> ${{ github.ref_name }} <<

on:
  release:
    types:
      - created
  workflow_dispatch:


jobs:
  build_and_push_images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./edge/cockpit/Dockerfile
            image: ghcr.io/${{ github.repository }}/edge_cockpit
            context: ./edge/cockpit
          - dockerfile: ./edge/orchestrator/Dockerfile
            image: ghcr.io/${{ github.repository }}/edge_orchestrator
            context: ./edge/orchestrator
          - dockerfile: ./edge/camera/Dockerfile
            image: ghcr.io/${{ github.repository }}/edge_camera
            context: ./edge/camera
          - dockerfile: ./edge/model_serving/tflite_serving/Dockerfile
            image: ghcr.io/${{ github.repository }}/edge_tflite_serving
            context: ./edge/model_serving/tflite_serving

    uses: ./.github/workflows/template_build_and_push_docker_images.yml
    with:
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}
